<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pensaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="pensaNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F294A"/>
      <stop offset="100%" stop-color="#051221"/>
    </linearGradient>
    <linearGradient id="pensaFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <filter id="pensaDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Navy Shield / Circle -->
  <circle cx="250" cy="250" r="235" fill="url(#pensaNavy)" filter="url(#pensaDropShadow)"/>
  
  <!-- Outer Gold Concentric Border -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#pensaGold)" stroke-width="8"/>
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#pensaGold)" stroke-width="5"/>

  <!-- Curved Text Paths -->
  <path id="pensaTopPath" fill="none" d="M 78 250 A 172 172 0 0 1 422 250" />
  <path id="pensaBottomPath" fill="none" d="M 420 250 A 170 170 0 0 1 80 250" />

  <!-- Circular Arch Text -->
  <text fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24.5" letter-spacing="3.5">
    <textPath href="#pensaTopPath" startOffset="50%" text-anchor="middle">PENTECOST STUDENTS &amp; ASSOCIATES</textPath>
  </text>
  <text fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16.5" letter-spacing="2.5">
    <textPath href="#pensaBottomPath" startOffset="50%" text-anchor="middle">UMaT TARKWA &bull; CHAPTER</textPath>
  </text>

  <!-- Side Star Emblems -->
  <polygon points="62,250 67,238 78,238 69,246 72,258 62,250 52,258 55,246 46,238 57,238" fill="#F59E0B"/>
  <polygon points="438,250 443,238 454,238 445,246 448,258 438,250 428,258 431,246 422,238 433,238" fill="#F59E0B"/>

  <!-- Inner Center Field -->
  <circle cx="250" cy="250" r="158" fill="#0A1D37"/>

  <!-- Radiant Beams Background in Center -->
  <g opacity="0.15" stroke="#FBBF24" stroke-width="2">
    <line x1="250" y1="250" x2="250" y2="100"/>
    <line x1="250" y1="250" x2="350" y2="140"/>
    <line x1="250" y1="250" x2="390" y2="230"/>
    <line x1="250" y1="250" x2="360" y2="330"/>
    <line x1="250" y1="250" x2="250" y2="390"/>
    <line x1="250" y1="250" x2="140" y2="330"/>
    <line x1="250" y1="250" x2="110" y2="230"/>
    <line x1="250" y1="250" x2="150" y2="140"/>
  </g>

  <!-- Holy Spirit Pentecost Flame of Revival -->
  <g transform="translate(0, -25)">
    <!-- Outer Flame -->
    <path d="M 250 115 
             C 215 170 190 205 205 245 
             C 212 265 228 280 250 280 
             C 272 280 288 265 295 245 
             C 310 205 285 170 250 115 Z" 
          fill="url(#pensaFlameGrad)" filter="url(#pensaDropShadow)"/>
    <!-- Inner Flame Core -->
    <path d="M 250 145 
             C 230 180 220 205 228 230 
             C 232 242 240 250 250 250 
             C 260 250 268 242 272 230 
             C 280 205 270 180 250 145 Z" 
          fill="#FFFBEB"/>
  </g>

  <!-- Open Bible Symbolizing The Word of God -->
  <g transform="translate(250, 275)">
    <!-- Left Page -->
    <path d="M 0 -10 C -45 -22 -85 -16 -108 -5 L -102 38 C -79 27 -39 21 0 32 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.5"/>
    <!-- Right Page -->
    <path d="M 0 -10 C 45 -22 85 -16 108 -5 L 102 38 C 79 27 39 21 0 32 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.5"/>
    <!-- Center Spine & Red Bookmark -->
    <path d="M -3 30 L 0 54 L 3 30 Z" fill="#DC2626"/>
    <!-- Page Scripture Lines -->
    <line x1="-85" y1="4" x2="-25" y2="4" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-80" y1="14" x2="-20" y2="14" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-75" y1="24" x2="-25" y2="24" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="25" y1="4" x2="85" y2="4" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="14" x2="80" y2="14" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="25" y1="24" x2="75" y2="24" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Official Brand Banner: PENSA UMaT -->
  <g transform="translate(0, 315)">
    <!-- Ribbon Shadow -->
    <path d="M 100 25 L 130 5 L 130 45 Z" fill="#78350F"/>
    <path d="M 400 25 L 370 5 L 370 45 Z" fill="#78350F"/>
    <!-- Ribbon Body -->
    <rect x="115" y="5" width="270" height="42" rx="6" fill="url(#pensaGold)" stroke="#FEF08A" stroke-width="2" filter="url(#pensaDropShadow)"/>
    <text x="250" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#0A192F" text-anchor="middle" letter-spacing="4">
      PENSA UMaT
    </text>
  </g>

  <!-- Motto Arc: Christ in you, the hope of glory -->
  <text x="250" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11.5" fill="#E2E8F0" text-anchor="middle" letter-spacing="1.5">
    CHRIST IN YOU, THE HOPE OF GLORY
  </text>
  <text x="250" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10.5" fill="#F59E0B" text-anchor="middle" letter-spacing="2">
    COLOSSIANS 1:27
  </text>
</svg>
